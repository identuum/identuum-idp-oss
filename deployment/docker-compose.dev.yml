# identuum-idp-oss local development compose stack.
#
# Two profiles:
#
#   (default)  — Postgres only. Used by `make fast-up` for unit + integration
#                tests; preserves the original developer flow. PG image is
#                postgres:18-alpine (migration 0001 requires the PG18+ built-in
#                uuidv7() function).
#
#   app        — Postgres + the OSS app container running cmd/identuum-idp via
#                the `migrate` subcommand then the no-arg default serve
#                (full OSS IdP on 0.0.0.0:7113, config from env). Used by
#                `make oss-up` to run the OSS demo locally on 127.0.0.1:7113.
#                The app container is gated behind the `app` profile so
#                `make fast-up` does NOT rebuild it on every test loop.
#
# Usage:
#   make fast-up          # Postgres only (default profile)
#   make fast-down        # stop + remove containers (volume preserved)
#   make fast-clean       # stop + remove volume (full reset)
#   make integration-test # run integration tests against this DB
#   make oss-up           # Postgres + OSS app container (app profile)
#   make oss-down         # stop the app container (Postgres preserved)
#   make oss-logs         # tail the app container logs
#
# Port allocation:
#   5532  identuum-ag monolith Postgres (avoid)
#   5533  identuum-ag-oss Postgres      (avoid)
#   5534  reserved
#   5513  identuum-idp-oss Postgres     <-- THIS FILE
#   7113  identuum-idp-oss app          <-- THIS FILE (app profile)
#
# Both host ports are variables with the defaults above: DEV_PG_HOST_PORT and
# DEV_APP_PORT, exported by the Makefile. DEV_APP_PORT is the app's host
# port, its container port, its listen address and its issuer at once, so one
# value moves all four (owner ruling t, 2026-10-07: identuum-ui's e2e-full
# harness runs its appliance on 17113 beside a dev stack on 7113).
#
# CE / monolith / IDP-CE / AG / UI / auth-service / wiki services are NOT
# included.
#
# Safety notes:
#   - DB URL is constructed entirely inside the container's env + entrypoint
#     script; nothing prints the URL to host stdout.
#   - The PG18 volume is named `identuum-idp-oss-postgres-data-v18` so it does
#     NOT collide with any prior PG16 volume named
#     `identuum-idp-oss-postgres-data`. The latter is empty (every migration
#     attempt against PG16 failed at 0001) and is left untouched by this
#     compose file.

# D-024 (owner ruling 2026-10-01): the development stack has its own names,
# identuum-idp-oss-dev*, so it and the production compose file (project and
# containers identuum-idp-oss, identuum-idp-oss-postgres; unchanged) can run on
# one host. Moving the default gives a stack started before D-024 a new
# project: its Postgres volume is project-scoped (see `volumes:` below), so the
# first `make fast-up` after the change starts an empty dev database, and a
# still-running pre-D-024 stack holds port 5513 until it is stopped. To keep
# the old stack, set IDENTUUM_IDP_COMPOSE_PROJECT=identuum-idp-oss.
#
# THE-SHARED-VOLUME (2026-09-04): the project name is OVERRIDABLE. It has to be overridable: two
# checkouts of this repository are both directories called identuum-idp-oss, so a
# FIXED project name makes every clone the SAME Compose project — same container
# names, and same scoped volumes even after a volume stops naming itself
# explicitly. Set IDENTUUM_IDP_COMPOSE_PROJECT in a second checkout to give it
# its own stack.
name: ${IDENTUUM_IDP_COMPOSE_PROJECT:-identuum-idp-oss-dev}

services:
  postgres-idp-oss:
    image: postgres:18-alpine
    # THE-SHARED-VOLUME: overridable for the same reason the volume lost its
    # explicit name — a fixed container_name is project-independent, so a
    # second checkout collided here even with its own project and port
    # (measured: "Conflict. The container name ... is already in use").
    # Default identuum-idp-oss-dev-postgres since D-024 (2026-10-01); no tool
    # addresses it by name (they use the compose service).
    container_name: ${IDENTUUM_IDP_COMPOSE_PROJECT:-identuum-idp-oss-dev}-postgres
    environment:
      POSTGRES_USER: idp_oss_user
      POSTGRES_PASSWORD: dev-idp_oss_user-not-a-secret
      POSTGRES_DB: identuum_idp_oss
    ports:
      # Bind to loopback only — not exposed to the network.
      # THE-SHARED-VOLUME: the HOST port is overridable, defaulting to 5513 so
      # nothing existing moves. A second checkout that only renamed its project
      # would still fail on the bind; DEV_PG_HOST_PORT is the same variable the
      # Makefile already probes for readiness, so overriding it keeps the probe
      # pointed at the port the stack actually published.
      - "127.0.0.1:${DEV_PG_HOST_PORT:-5513}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U idp_oss_user -d identuum_idp_oss"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s
    volumes:
      # PG18+ uses /var/lib/postgresql (root) as the mount target — not
      # /var/lib/postgresql/data like PG ≤ 17 — because the image now
      # stores data in major-version-specific subdirectories to support
      # pg_upgrade --link safely. See:
      # https://github.com/docker-library/postgres/pull/1259
      # The volume name is distinct from the prior PG16 volume so neither
      # can collide. Remove explicitly via `make fast-clean` to reset.
      - postgres-idp-oss-data-v18:/var/lib/postgresql

  # OSS app — gated behind the `app` profile so the default Postgres-only
  # flow used by `make fast-up` + integration tests is unaffected. Build
  # is the OSS bundled binary from cmd/identuum-idp; the entrypoint runs
  # `identuum-idp migrate "$IDENTUUM_IDP_OSS_DB"` first (one-shot) and
  # then exec's the no-arg default serve (full IdP on 0.0.0.0:7113).
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.local
    # Derived from the project like the container names: a second project
    # (the ui's e2e-full harness runs as identuum-e2e) building under a fixed
    # tag would retag the default project's image. Default
    # identuum-idp-oss-dev:local since D-024.
    image: ${IDENTUUM_IDP_COMPOSE_PROJECT:-identuum-idp-oss-dev}:local
    # THE-SHARED-VOLUME: same reasoning as the postgres container above.
    container_name: ${IDENTUUM_IDP_COMPOSE_PROJECT:-identuum-idp-oss-dev}
    restart: unless-stopped
    depends_on:
      postgres-idp-oss:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-7113}:${DEV_APP_PORT:-7113}"
    environment:
      # DB URL assembled inside the container only. Host stdout never sees it.
      IDENTUUM_IDP_OSS_DB: "postgres://idp_oss_user:dev-idp_oss_user-not-a-secret@postgres-idp-oss:5432/identuum_idp_oss?sslmode=disable"
      IDENTUUM_IDP_OSS_ISSUER: "http://localhost:${DEV_APP_PORT:-7113}"
      IDENTUUM_IDP_OSS_LISTEN: "0.0.0.0:${DEV_APP_PORT:-7113}"
      # At-rest AES key, overridable from the host env. STABLE BY DEFAULT
      # (SIGNING-KEY-SEAL-1): this dev app has no /app/data volume, so an empty
      # key made the entrypoint mint a fresh key PER CONTAINER INSTANCE — any
      # recreate then stranded every sealed row (signing keys, MFA secrets),
      # which surfaced as an undecryptable ACTIVE signing key and a login that
      # bounced back to /login. Defaulting to a FIXED, well-known, NON-SECRET
      # dev key makes recreates reuse the same at-rest key so the seal class
      # cannot fire on the dev box. It is a dev-only constant (the same value
      # CI and the integration harness use) — NEVER use it in production; set a
      # real IDENTUUM_IDP_ENCRYPTION_KEY there. Override it here from your host
      # env at any time.
      IDENTUUM_IDP_ENCRYPTION_KEY: "${IDENTUUM_IDP_ENCRYPTION_KEY:-cafebabecafebabecafebabecafebabecafebabecafebabecafebabecafebabe}"
      # TEST-ONLY rate-limit escape hatch (internal/runtime/insecure_dev_mode.go):
      # defaults EMPTY (flag OFF — full rate limiting + login lockout). The
      # e2e-full harness exports it "true" so its hundreds of same-IP logins
      # don't trip the LoginRiskService lockout (5 failures / 15min). Disables
      # server-side rate limiting ONLY; auth/MFA/sessions never read it.
      IDENTUUM_IDP_INSECURE_DEV_MODE: "${IDENTUUM_IDP_INSECURE_DEV_MODE:-}"
      # Browser-facing UI origin for the WebAuthn RP allowlist
      # (internal/runtime/webauthn_ui_origin.go). Defaults EMPTY → the runtime's
      # localhost default (http://localhost:7104, the standing dev UI). The
      # e2e-full harness exports its own dedicated dev-loop UI port so passkey
      # ceremonies from that origin pass the RP origin check.
      IDENTUUM_IDP_UI_PUBLIC_BASE_URL: "${IDENTUUM_IDP_UI_PUBLIC_BASE_URL:-}"

volumes:
  # THE-SHARED-VOLUME (2026-09-04): NO EXPLICIT `name:` HERE, deliberately.
  # It used to read `name: identuum-idp-oss-postgres-data-v18`, which opts a
  # volume OUT of project scoping — so every checkout of this repository on a
  # machine bound the SAME volume, and `make fast-clean` run in a newcomer's
  # clone silently destroyed the maintainer's dev database. Measured before the
  # change: two checkouts in different directories both resolved to that one
  # volume name.
  #
  # Without the name, Compose scopes it to the project — which is why the
  # project name above had to become overridable in the same change. The old
  # volume is ORPHANED by this and is not migrated: a one-time dev reset is the
  # accepted cost (owner ruling). The stale volume to remove once, by hand, is
  # named in the commit message and the wiki entry.
  postgres-idp-oss-data-v18:
