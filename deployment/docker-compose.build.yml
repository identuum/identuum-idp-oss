# identuum-idp-oss — developer source-build overlay.
#
# ★ MAINTAINER / DEVELOPER ONLY. NOT THE CUSTOMER PATH. ★
#
# The customer-facing default (deployment/docker-compose.yml) is image-only:
# it pulls `ghcr.io/identuum/identuum-idp-oss` from the official registry and
# never builds anything on the customer host. A customer who downloads only
# that one file MUST NOT need a source checkout.
#
# This overlay restores the local `build:` context so a maintainer can
# rebuild the image from source for local iteration. The UI is not a
# separate image since v0.6.0: the binary embeds the vendored identuum-ui
# export (internal/uiexport, refreshed by `make ui-vendor`), so this repo
# alone is the build context. Compose's last-file-wins overlay rules apply:
# the `image:` tag from the base file is preserved (so `docker compose up -d`
# after a build uses the same tag), and the `build:` block added here drives
# `docker compose build` / `docker compose up -d --build`.
#
# Usage:
#
#   # Build locally and run from the build:
#   docker compose \
#     -f deployment/docker-compose.yml \
#     -f deployment/docker-compose.build.yml \
#     up -d --build
#
#   # Build only:
#   docker compose \
#     -f deployment/docker-compose.yml \
#     -f deployment/docker-compose.build.yml \
#     build

services:

  identuum-idp:
    build:
      # Build context is the module root (one level above this file).
      context: ..
      dockerfile: deployment/Dockerfile.local
