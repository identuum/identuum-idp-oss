name: Bug report
description: Report a defect in identuum-idp-oss
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security issues here.** Follow [SECURITY.md](https://github.com/identuum/identuum-idp-oss/security/policy).
        See [CONTRIBUTING.md](https://github.com/identuum/identuum-idp-oss/blob/main/CONTRIBUTING.md) for what makes a good report.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `identuum-idp version`, or the version on the console's Platform status page.
      placeholder: identuum-idp-oss 0.9.2 (commit abc1234)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Docker Compose
        - Binary
        - From source
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: "18.1"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Remove secrets first: tokens, cookies, passwords, database URLs, TOTP secrets, recovery codes and key material."
      render: shell
