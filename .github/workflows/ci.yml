# identuum-idp-oss CI pipeline.
# Runs on every push and pull request to main/master.
#
# Every job drives the SAME Makefile targets developers run locally, so CI
# cannot silently drift from `make verify` / `make integration-test`:
#
#   1. verify       — `make ci-verify` (= `make verify` minus the two
#                     LOCAL-ONLY gograph lines, minus govulncheck which has
#                     its own job, and minus the THREE wiki-coupled targets
#                     that cannot fire here because CI checks out one repo
#                     and the ../wiki sibling is absent — enumerated, and
#                     this list must stay equal to what the Makefile
#                     subtracts:
#                       - repo-green      ($(WIKI_TOOLS)/repo-green-gate.sh;
#                                          its four floors — fmt, build,
#                                          test, vet — are explicit ci-verify
#                                          steps, so CI loses nothing)
#                       - clock-fuse-gate ($(WIKI_TOOLS)/clockfuse-gate.sh;
#                                          the snapshot comparison is
#                                          local-only — recorded residue,
#                                          REL-CI-WIKI-COUPLING —
#                                          clock-fuse-report still runs and
#                                          hard-fails on tool error and the
#                                          deadline arm)
#                       - wiki-fresh      (self-skips when ../wiki is absent;
#                                          the call could only ever print
#                                          SKIPPED)
#                       - ledger-diff-gate (THE-LEDGER-DIFF-GATE: its base is
#                                          the previous ACCEPTED witness commit,
#                                          measured from the local witness
#                                          chain that CI's single-commit
#                                          checkout does not carry — see the
#                                          gate-witness tie-note; the same
#                                          reconciliation runs in every local
#                                          `make verify` and its evidence line
#                                          is in the committed GATE-RUN.txt)
#                     rulefloor-check is NO LONGER subtracted: since
#                     THE-TOOLING-UPGRADE the verify job installs the real
#                     rulefloor binary (built from the workflow-env-pinned
#                     tag tarball — THE-SECOND-INSTALL) and ci-verify
#                     runs the same `make rulefloor-check` developers run —
#                     hashes, extractor-owned discovery, orphan scan. The
#                     tools/rulefloorlite subset it replaces reimplemented
#                     extraction with pre-v0.3.0 string-marker semantics,
#                     measurably diverged from the real extractor, and is
#                     deleted.
#                     + the integration-tagged compile/lint that `verify`
#                     itself does not exercise.
#   2. integration  — `make ci-integration-test` against a Postgres service
#                     (e2e + DB-backed runtime + pkg/runtime teeth), then
#                     `make rulefloor-integration` (THE-CI-TEETH): the
#                     RULE-FLOOR.md DB-profile teeth execute here too, with
#                     the SAME workflow-env-derived rulefloor build as the
#                     verify job — one declared version, both jobs derive
#                     (THE-SECOND-INSTALL; this line previously claimed a
#                     parity that did not hold).
#                     Nothing of the developer `integration-test` chain is
#                     subtracted anymore except `test-db` (createdb +
#                     migrate bootstrap — the service container provides
#                     the database and the suites migrate themselves).
#   3. race         — `go test -race ./... -count=1`. CI-ONLY: the race
#                     detector is deliberately NOT part of `make verify`.
#
# gograph stays a developer-local tool BY DECISION, re-affirmed 2026-08-27
# (THE-SAME-BINARY): Linux release artifacts EXIST (the cask's GoReleaser
# tarballs), so this is a choice, not an impossibility. What CI would buy
# is the `gograph boundaries` architecture gate; what it would cost is a
# precise type-loading graph build (~minutes) on every run. The boundary
# gate runs in every local `make verify` close, its ordering is pinned by
# TestVerifyGateSetBoundaryContract, and the README validation matrix
# states the CI omission explicitly — recorded, enforced locally, skipped
# here on cost. grype and tidy-diff RUN in CI via `ci-verify` —
# previously they were developer-only. govulncheck also runs in CI, but as its
# OWN JOB rather than inside `ci-verify`, so a vulnerability database that moves
# under an unchanged tree turns that job red without taking the build/test
# signal down with it. See the Makefile `ci-verify` / `verify` targets.
#
# No real secrets are required. Every committed credential is a
# TRANSPARENT PLACEHOLDER, fake by construction (THE-TRANSPARENT-CREDENTIALS):
# database passwords are dev-<user>-not-a-secret, and the data encryption key
# is the sequential byte string 00 01 02 … 1f — a value nobody would ever
# deploy, so it can never be mistaken for a leaked real key. The
# credential-transparency Makefile gate refuses anything else.
#
# Port allocation: identuum-idp-oss uses 5513 to avoid conflicts with
# the monolith (5432), the AG monolith (5532), and identuum-ag-oss
# (5533). Reserved: 5534.
#
# CE, monolith, IDP-CE, AG, UI, auth-service, and wiki services are
# NOT included.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Well-known public dev AES key — not a real secret. Safe ONLY for CI.
  IDENTUUM_IDP_DATA_ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
  IDENTUUM_IDP_DEPLOYMENT_MODE: dev
  # THE-SECOND-INSTALL: the ONE declared rulefloor version for the WHOLE
  # workflow — every job that installs rulefloor derives its URL tag,
  # tarball directory, ldflags stamp, and version assert from this pair.
  # (The previous job-level declaration let the Integration job keep a
  # second, older go-install route invisibly.) Bump both lines together.
  RULEFLOOR_VERSION: v0.9.1
  RULEFLOOR_SHA256: 7a04a6ccbd87a53b342a4f324318bf2034cd0bb640c8191badb87d23abb5f509
  # THE-UNWATCHED-FOUR: the discipline above was ONE TOOL WIDE — local
  # staticcheck drifted a whole slice unseen because rulefloor was the
  # only tool CI printed and asserted. One declaration per tool, every
  # install derived, every version printed and asserted below. Go's
  # single source is go.mod's `go` directive (asserted, not
  # re-declared). Latest-stable owner rule applies to all of them.
  STATICCHECK_VERSION: v0.8.1
  GRYPE_VERSION: v0.118.0
  GOVULNCHECK_VERSION: v1.7.0
  # THE-UNWATCHED-FOUR: the vendored install gate must be byte-identical
  # to the shared master — a weakened copy would let this CI pass with a
  # gate that no longer gates. This digest is the master's sha256; the
  # integrity step below verifies the copy, and the wiki-side check
  # compares master against both vendored copies AND this recorded
  # digest. Bump all together when the gate changes.
  RULEFLOOR_GATE_SHA256: "db2a505d1c1f2fb55b34632a5098ef658dd6fbab1671e58de2c41788a63f37a6"
  # THE-UNWITNESSED-MIRROR: same contract for the gate witness — the vendored
  # scripts/gate-witness.sh must be the wiki master, or the record CI uploads
  # is written by something else. Held identical to the wiki-side digest
  # (contracts/gate-witness.master.sha256) by gate-witness.sh --sync-check.
  GATE_WITNESS_SHA256: "1377b103674b75f97d171fa41fed1651863ca9c0244ee51972b125c266d9ed5e"

jobs:
  verify:
    name: Verify (ci-verify + integration lint)
    runs-on: ubuntu-latest
    # P2-24 (owner approved): an ephemeral Postgres so the DB-backed runtime
    # tests RUN here instead of skipping. They skipped in EVERY gate — local
    # and CI — and a skip is green, so the strongest tests in internal/runtime
    # were decoration. The tests self-migrate (migrateTestSchema), so the
    # service needs no init beyond existing.
    #
    # IDENTUUM_IDP_REQUIRE_DB_TESTS turns a missing DSN into a FAILURE
    # (internal/runtime/testdb_test.go): if this service is ever lost — renamed,
    # misconfigured, or silently dropped — the job goes red instead of the
    # suite quietly shrinking back to skips.
    #
    # postgres:18-alpine: Postgres SERVICE images are exempt under
    # IMG-NONALPINE (owner decision — canonical text beside
    # image-base-check in the Makefile; cite it by name, never restate
    # it). Matches the integration job below and both compose files.
    # THE-IMAGE-POLICY-TRUTH (2026-08-22): this job alone pinned Debian
    # postgres, justified by a wider restatement of the policy that the
    # owner decision never made and this file's own integration job
    # contradicted.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: dev-ci-not-a-secret
          # THE-CI-TEETH: must end in _test — testsupport.RequireTestDatabase
          # refuses any other name (these suites TRUNCATE), and the escape
          # env IDENTUUM_IDP_ALLOW_NON_TEST_DB is deliberately NEVER set in
          # CI. Measured before the rename: every DB-backed runtime test
          # FAILED with the refusal against "identuum_ci".
          POSTGRES_DB: identuum_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d identuum_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTUUM_IDP_TEST_DATABASE_URL: postgres://ci:dev-ci-not-a-secret@127.0.0.1:5432/identuum_ci_test?sslmode=disable
      IDENTUUM_IDP_REQUIRE_DB_TESTS: "1"
      # The single-replica lease contends when tests share one DB; the runtime
      # tests set this themselves locally, and CI matches (A-2a memory note).
      IDENTUUM_IDP_ALLOW_MULTI_REPLICA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the install gate is the shared master
        # THE-UNWATCHED-FOUR: a weakened vendored copy would pass CI with
        # a gate that no longer gates. The digest is pinned at workflow
        # env; the wiki-side check holds master, both copies, and that
        # pin identical.
        run: echo "${RULEFLOOR_GATE_SHA256}  scripts/rulefloor-install-gate.sh" | sha256sum -c -

      - name: Verify the gate witness is the shared master
        # THE-UNWITNESSED-MIRROR: the asymmetry closed — the install gate was
        # digest-checked here but the witness that writes this job's uploaded
        # record was not.
        run: echo "${GATE_WITNESS_SHA256}  scripts/gate-witness.sh" | sha256sum -c -

      - name: Reject undeclared rulefloor install routes
        # Vendored at scripts/rulefloor-install-gate.sh because this
        # single-repo CI checkout has no ../wiki sibling. Scanning the full
        # workflow directory makes a second install route fail before tools run.
        run: bash scripts/rulefloor-install-gate.sh .github/workflows

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prove the Go toolchain version
        # THE-UNWATCHED-FOUR: Go's single declaration is go.mod's `go`
        # directive; this proves the runner actually resolved it.
        run: |
          go version
          go version | grep -F "go$(awk '/^go /{print $2}' go.mod) "

      # ci-verify runs staticcheck, grype, and the RULE-FLOOR.md ledger gate —
      # install their binaries first. govulncheck is NOT installed here: it
      # has its own job.
      - name: Install staticcheck (and prove its version)
        # OWNER RULE (2026-08-27): CI workflows always pin the LATEST
        # stable tool version — pinned (never rolling @latest, which
        # re-scopes silently) and bumped deliberately the moment a new
        # stable ships. v0.8.1 == staticcheck 2026.2.1, latest stable.
        # THE-UNWATCHED-FOUR: the install derives from the workflow-env
        # declaration and the printed version is asserted — staticcheck
        # prints its module version in parentheses, e.g.
        # "staticcheck 2026.2.1 (0.8.1)".
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          staticcheck --version
          staticcheck --version | grep -F "(${STATICCHECK_VERSION#v})"

      - name: Install rulefloor (brew-identical build)
        # THE-SAME-BINARY (2026-08-27): CI builds rulefloor from the SAME
        # immutable source artifact local brew builds — the tag tarball and
        # sha256 lifted from the tap formula — with brew's exact ldflags
        # version stamp. `go install` is banned here: it resolves through
        # the module proxy (a different artifact chain than the tarball)
        # and stamps no version (self-reports "dev", unverifiable).
        # THE-UNBOUND-STAMP/THE-SECOND-INSTALL: RULEFLOOR_VERSION is
        # declared ONCE, at the WORKFLOW env — the URL tag, tarball
        # directory, ldflags stamp, and the assert step in EVERY job
        # derive from it, mirroring how brew derives v#{version} from
        # its url. A bump edits exactly two lines (version + sha), and
        # no pair of them can diverge silently.
        run: |
          curl -sSfL -o rulefloor.tar.gz "https://github.com/ozgurcd/rulefloor/archive/refs/tags/${RULEFLOOR_VERSION}.tar.gz"
          echo "${RULEFLOOR_SHA256}  rulefloor.tar.gz" | sha256sum -c -
          tar -xzf rulefloor.tar.gz
          (cd "rulefloor-${RULEFLOOR_VERSION#v}" && go build -ldflags "-X main.version=${RULEFLOOR_VERSION}" -o "$(go env GOPATH)/bin/rulefloor" .)
          rm -rf rulefloor.tar.gz "rulefloor-${RULEFLOOR_VERSION#v}"

      - name: Prove the rulefloor version
        # A version nobody prints is a version nobody can check
        # (THE-SAME-BINARY). The assert derives from the SAME workflow-env
        # string the build stamped (THE-UNBOUND-STAMP): what it proves is
        # that the binary on PATH is the one this workflow just built —
        # the artifact identity itself is carried by the sha256 pin.
        run: |
          rulefloor version --json
          rulefloor version --json | grep -F "\"version\":\"${RULEFLOOR_VERSION}\""

      - name: Install grype (and prove its version)
        # Pinned to a tagged release — BOTH the install script ref and the
        # installed version — so the supply chain cannot move under CI. `main`
        # is a rolling branch with no checksum; a tag is immutable. (Severity /
        # fail-on policy is owner-controlled and lives in the Makefile
        # grype-scan target, not here.) THE-UNWATCHED-FOUR: both version
        # uses derive from the workflow-env declaration and the printed
        # version is asserted.
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" | sh -s -- -b "$(go env GOPATH)/bin" "${GRYPE_VERSION}"
          grype --version
          grype --version | grep -F "grype ${GRYPE_VERSION#v}"

      # The whole verify matrix in one Makefile target: image-base-check,
      # tidy-diff, build, unit tests, staticcheck, grype-scan. The steps of
      # `verify` omitted by design are enumerated ONCE, in this file's header
      # (gograph, govulncheck, and the three wiki-coupled targets) — this
      # comment used to carry its own shorter list, which drifted the moment
      # the header's grew. One list, one place.
      - name: make ci-verify
        # GATE_WITNESS_TIE=commit: this checkout cannot commit its record, so
        # the witness ties it to the commit SHA the job executed against
        # instead of the local content digest (the record itself says why).
        env:
          GATE_WITNESS_TIE: commit
        run: make ci-verify

      - name: Stamp CI provenance into the record
        # THE-UNRUN-CI: a gate-witness record cannot say where it came from.
        # A LOCAL `make ci-verify` writes the same file, with the same gate
        # label, into the same gitignored path — one such record (green,
        # commit-tied, 138 commits stale) was sitting in a working tree and
        # the first version of tools/ci-witness accepted it as CI evidence.
        # This line is the only thing in the file a local run cannot forge,
        # and tools/ci-witness REFUSES a committed record without it.
        # if: always() — a red record needs provenance just as much.
        if: always()
        run: |
          if [ -f GATE-RUN.ci.txt ]; then
            echo "ci-run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} sha=${GITHUB_SHA}" >> GATE-RUN.ci.txt
          fi

      - name: Upload the gate run record
        # if: always() — a red or half-dead run must still upload its record;
        # an INCOMPLETE record that names the unrun targets is the point.
        # if-no-files-found stays warn: when the job dies before ci-verify
        # starts there is no record, and the step must not repaint that
        # failure as its own.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-run-ci-verify
          path: GATE-RUN.ci.txt
          if-no-files-found: warn

      # `verify` / `ci-verify` build and lint only the DEFAULT tag set. The
      # integration-tagged code (internal/e2e, internal/postgres) still needs a
      # compile + lint gate here; this preserves the coverage the previous CI
      # had via its separate build/staticcheck jobs.
      - name: Integration-tagged compile + lint
        run: |
          go build -tags integration ./...
          staticcheck -tags integration ./...

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck (and prove its version)
        # Installed inline. No binary is vendored or committed. Pinned to
        # the latest stable SCANNER (@latest was the rolling-pin class
        # THE-SAME-BINARY closed for staticcheck). The vulnerability
        # DATABASE stays rolling BY DESIGN: that movement is this job's
        # whole purpose, which is why it is its own job and not part of
        # ci-verify. THE-UNWATCHED-FOUR: the install derives from the
        # workflow-env declaration and the printed scanner version is
        # asserted.
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -version
          govulncheck -version | grep -F "govulncheck@${GOVULNCHECK_VERSION}"

      # Its own job on purpose, and therefore deliberately absent from
      # `ci-verify`: a vulnerability database moves under a tree that has not
      # moved, so a red scan here leaves the build/test signal intact and "the
      # code broke" stays distinguishable from "the world changed". `make verify`
      # still runs it for anyone running the full chain locally.
      - name: Govulncheck
        run: govulncheck ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 18+ is required: migration 0001 depends on the
        # built-in uuidv7() function introduced in PG 18. Older images
        # (e.g. postgres:16-alpine) will fail at migration time.
        # Keep in sync with deployment/docker-compose.dev.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: idp_oss_user
          POSTGRES_PASSWORD: dev-idp_oss_user-not-a-secret
          # THE-CI-TEETH: must end in _test (testsupport.RequireTestDatabase
          # refuses any other name; measured — the old "identuum_idp_oss"
          # failed every guarded test AND collided with the live dev DB's
          # name). Matches the local convention (OSS_TEST_DB_URL).
          POSTGRES_DB: identuum_idp_oss_test
        ports:
          - 5513:5432
        options: >-
          --health-cmd "pg_isready -U idp_oss_user -d identuum_idp_oss_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5513 -U idp_oss_user; do
            sleep 1
          done
        env:
          PGPASSWORD: oss_dev_local_only

      # Drives the Makefile target verbatim (e2e + DB-backed runtime +
      # pkg/runtime teeth). The DSN is supplied via env and is NOT echoed —
      # the recipe is @-prefixed and the Makefile respects
      # IDENTUUM_IDP_TEST_DATABASE_URL when set. ci-integration-test, not
      # integration-test: the developer target additionally runs test-db
      # (createdb — the service container already provides the database).
      - name: Migrate the integration database
        # THE-UNRUN-CI (2026-09-04): the service container CREATES
        # identuum_idp_oss_test but NOTHING MIGRATED IT, so every test that
        # touches the live schema died on `relation "oidc_states" does not
        # exist (SQLSTATE 42P01)`. Locally `test-db` is a prerequisite of the
        # integration run and does create + build + migrate; CI had the create
        # half and not the migrate half, and had been RED for five consecutive
        # runs (33641794378, 33762990950, 33800808443, 33854648164 and the
        # 2026-08-31 run before them) with every local gate green.
        #
        # `make test-db` on purpose, not an inline DSN: the connection string
        # then comes from OSS_TEST_DB_URL like everywhere else, so this step
        # cannot drift from the target it is standing in for. The CREATE half
        # is idempotent and the service has already done it.
        #
        # DECLARED, UNRUN: written from the failure log of run 33854648164;
        # no CI run has executed this step.
        run: make test-db

      - name: make ci-integration-test
        env:
          IDENTUUM_IDP_TEST_DATABASE_URL: postgres://idp_oss_user:dev-idp_oss_user-not-a-secret@localhost:5513/identuum_idp_oss_test?sslmode=disable
        run: make ci-integration-test

      # THE-CI-TEETH: the DB-profile ledger teeth now run in CI too, then
      # the same `make rulefloor-integration` developers run (check
      # --run-profile integration --tags integration). Runs AFTER
      # ci-integration-test: the suites have already migrated the service
      # database by then. THE-SECOND-INSTALL: this step previously
      # `go install`ed a DIFFERENT rulefloor (v0.6.0, module proxy, no
      # stamp) under a comment claiming parity with the verify job — two
      # install methods, two versions, one ledger, in one file. It now
      # derives from the SAME workflow-level env as verify, and proves
      # what it built before the teeth run.
      - name: Install rulefloor (brew-identical build)
        run: |
          curl -sSfL -o rulefloor.tar.gz "https://github.com/ozgurcd/rulefloor/archive/refs/tags/${RULEFLOOR_VERSION}.tar.gz"
          echo "${RULEFLOOR_SHA256}  rulefloor.tar.gz" | sha256sum -c -
          tar -xzf rulefloor.tar.gz
          (cd "rulefloor-${RULEFLOOR_VERSION#v}" && go build -ldflags "-X main.version=${RULEFLOOR_VERSION}" -o "$(go env GOPATH)/bin/rulefloor" .)
          rm -rf rulefloor.tar.gz "rulefloor-${RULEFLOOR_VERSION#v}"
          rulefloor version --json
          rulefloor version --json | grep -F "\"version\":\"${RULEFLOOR_VERSION}\""

      - name: make rulefloor-integration
        env:
          IDENTUUM_IDP_TEST_DATABASE_URL: postgres://idp_oss_user:dev-idp_oss_user-not-a-secret@localhost:5513/identuum_idp_oss_test?sslmode=disable
        run: make rulefloor-integration

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # CI-ONLY: the race detector is deliberately NOT in `make verify` (it
      # ~10x's test wall time). Untagged packages only — no DB required.
      - name: go test -race
        run: go test -race ./... -count=1
