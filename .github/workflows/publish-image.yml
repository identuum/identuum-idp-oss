# identuum-idp-oss — manual image publish workflow.
#
# ★ MANUAL ONLY. workflow_dispatch — never runs on push or PR. ★
#
# Builds the OSS IDP container image from deployment/Dockerfile.local and
# pushes it to ghcr.io/identuum/identuum-idp-oss with a user-specified version
# tag and a short-SHA tag. An opt-in `latest_tag` input also pushes :latest;
# that input defaults to `false` so an accidental run NEVER moves the rolling
# `latest` pointer.
#
# Customer install (wiki/platform/idp-appliance-install-ux.md
# D-IDP-INSTALL-06) expects:
#
#   curl -fsSLO https://github.com/identuum/identuum-idp-oss/releases/latest/download/docker-compose.yml
#   docker compose up -d
#   open http://localhost:7113
#
# The customer-facing deployment/docker-compose.yml pins an image this
# workflow published, `ghcr.io/identuum/identuum-idp-oss:<tag>@sha256:<digest>`
# (tag AND digest; the pin there names which release). This workflow publishes
# the image that the customer command flow expects.
#
# P2-3 hardening (this job has packages:write, so it is privileged):
#   - the user-supplied version_tag is consumed ONLY via an env var, never
#     interpolated into a shell script (no ${{ }} inside any run: block);
#   - the workflow checks out the REQUESTED TAG (not the dispatch ref) and
#     proves the tag exists AND resolves to the checked-out commit;
#   - the image is built, vuln-scanned (Trivy, fail on HIGH/CRITICAL), and
#     canonically verified (binary --version must match the tag) BEFORE any
#     push;
#   - provenance (SLSA) + SBOM attestations are ENABLED on the pushed manifest;
#   - every action is pinned to an immutable commit SHA (movable v-tags can be
#     retargeted upstream).
#
# Permissions:
#   contents: read   — checkout
#   packages: write  — push to ghcr.io with the workflow's
#                      ${{ secrets.GITHUB_TOKEN }} (no PAT, no static secret,
#                      no third-party credential).
#
# No secrets are added by this workflow. No registry credentials are stored in
# the repository.

name: Publish OSS IDP image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Git tag to build and publish (e.g. v0.2.0). Must already exist and point at the commit to release. Pushed alongside the short-SHA tag.'
        required: true
        type: string
      latest_tag:
        description: 'Also push :latest. Defaults to false; never set true on an accidental run.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    env:
      # P2-3: user-controlled inputs are exposed ONLY as env vars and referenced
      # as "$VERSION_TAG" / "$LATEST_TAG" in shell. They are NEVER placed inside
      # a run: block as ${{ inputs.* }}, which would let a dispatcher of this
      # packages:write job inject arbitrary shell.
      VERSION_TAG: ${{ inputs.version_tag }}
      LATEST_TAG: ${{ inputs.latest_tag }}
      LOCAL_IMAGE: identuum-idp-oss:verify
    steps:
      # OSS-RELEASE-REF: the image's SLSA provenance records the DISPATCH ref
      # (github_ref, github_workflow_ref), not the tag checked out below;
      # v0.9.2's image, dispatched on main, records refs/heads/main. A publish
      # is refused here, before anything is built or pushed, unless it was
      # dispatched on its own tag. cmd/identuum-idp/release_ref_check_test.go
      # runs this step's script.
      - name: Check the dispatch ref
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/tags/${VERSION_TAG}" ]; then
            echo "::error::a release must be dispatched on its tag so its attestations name it: expected refs/tags/${VERSION_TAG}, got ${GITHUB_REF} (gh workflow run publish-image.yml --ref ${VERSION_TAG} -f version_tag=${VERSION_TAG} -f latest_tag=false)"
            exit 1
          fi

      - name: Checkout the requested version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the TAG the operator requested, not the ref the workflow was
          # dispatched from. fetch-depth: 0 brings tags so the next step can
          # prove the tag ↔ commit binding.
          ref: ${{ inputs.version_tag }}
          fetch-depth: 0

      - name: Verify the tag exists and matches the checked-out commit
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null; then
            echo "::error::tag '${VERSION_TAG}' does not exist in this repository"
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${VERSION_TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "::error::tag '${VERSION_TAG}' -> ${TAG_COMMIT} does not match checked-out ${HEAD_COMMIT}"
            exit 1
          fi
          echo "verified: ${VERSION_TAG} points at ${HEAD_COMMIT}"

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/identuum-idp-oss"
          TAGS="${REGISTRY_IMAGE}:${VERSION_TAG},${REGISTRY_IMAGE}:sha-${SHORT_SHA}"
          if [ "${LATEST_TAG}" = "true" ]; then
            TAGS="${TAGS},${REGISTRY_IMAGE}:latest"
          fi
          # Version stamp for the ldflags build-arg (Order C): the dispatched
          # tag with its leading v stripped — the value the canonical
          # binary-vs-tag gate expects the binary to report.
          VERSION_SEMVER="${VERSION_TAG#v}"
          {
            echo "registry_image=${REGISTRY_IMAGE}"
            echo "short_sha=${SHORT_SHA}"
            echo "version_semver=${VERSION_SEMVER}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        # Required so the linux/arm64 stage can cross-compile on the linux/amd64
        # GitHub-hosted runner.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build amd64 image for verification (no push)
        # Single-arch build LOADED into the runner's docker so the following
        # steps can scan + smoke-verify the exact artifact before anything is
        # published. buildx layer cache makes the later multi-arch build cheap.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deployment/Dockerfile.local
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version_semver }}
            COMMIT=${{ steps.meta.outputs.short_sha }}

      - name: Canonical verification — binary version matches the tag
        run: |
          set -euo pipefail
          # Override the entrypoint (which would run migrate+serve) to invoke the
          # binary directly. This ties the PUBLISHED tag to the ACTUAL binary
          # version and would have caught the 0.2.0-vs-v0.1.0 drift.
          BIN_VERSION="$(docker run --rm --entrypoint /app/identuum-idp "${LOCAL_IMAGE}" --version)"
          EXPECTED="${VERSION_TAG#v}"
          echo "binary reports: '${BIN_VERSION}'; tag expects to contain: '${EXPECTED}'"
          case "${BIN_VERSION}" in
            *"${EXPECTED}"*) echo "version verified: binary matches tag ${VERSION_TAG}" ;;
            *) echo "::error::binary version '${BIN_VERSION}' does not match tag '${VERSION_TAG}'"; exit 1 ;;
          esac

      - name: Canonical verification — the image serves against a real Postgres
        # The loaded amd64 image, started the way an operator starts it (its
        # own entrypoint: migrate, then serve) against a throwaway Postgres.
        # /readyz must answer 200, the schema must reach the newest migration
        # in this checkout, and `version` must name the tag and the commit.
        # Nothing is published until this passes. postgres:18-alpine: Postgres
        # service images are exempt under IMG-NONALPINE, as in ci.yml.
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker network create idp-verify >/dev/null
          docker run -d --name idp-verify-pg --network idp-verify \
            -e POSTGRES_USER=identuum_idp -e POSTGRES_PASSWORD=dev-identuum_idp-not-a-secret -e POSTGRES_DB=identuum_idp \
            postgres:18-alpine >/dev/null
          # Over TCP: the image's first-start init server listens on the Unix
          # socket only, so a socket probe answers before the server the IdP
          # dials is up, and the IdP's one migrate attempt is refused.
          for _ in $(seq 1 60); do
            docker exec idp-verify-pg pg_isready -h 127.0.0.1 -U identuum_idp -d identuum_idp >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name idp-verify --network idp-verify -p 127.0.0.1:7113:7113 \
            -e IDENTUUM_IDP_DATABASE_URL="postgres://identuum_idp:dev-identuum_idp-not-a-secret@idp-verify-pg:5432/identuum_idp?sslmode=disable" \
            -e IDENTUUM_IDP_OSS_LISTEN=0.0.0.0:7113 \
            -e IDENTUUM_IDP_DATA_DIR=/app/data \
            -e IDENTUUM_IDP_OSS_ISSUER=http://localhost:7113 \
            -e IDENTUUM_IDP_UI_PUBLIC_BASE_URL=http://localhost:7113 \
            "${LOCAL_IMAGE}" >/dev/null
          code=000
          for _ in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7113/readyz || true)"
            [ "${code}" = 200 ] && break
            sleep 1
          done
          if [ "${code}" != 200 ]; then
            echo "::error::/readyz answered ${code} after 90s"
            docker logs idp-verify 2>&1 | tail -40
            exit 1
          fi
          newest="$(find migrations -maxdepth 1 -name '[0-9]*.sql' | sed -E 's#.*/0*([0-9]+)_.*#\1#' | sort -n | tail -1)"
          schema="$(docker exec idp-verify-pg psql -tA -U identuum_idp -d identuum_idp -c 'SELECT max(version_id) FROM goose_db_version')"
          echo "migrated schema: ${schema}; newest migration in this checkout: ${newest}"
          [ "${schema}" = "${newest}" ] || { echo "::error::schema ${schema} is not the newest migration ${newest}"; exit 1; }
          ver="$(docker exec idp-verify /app/identuum-idp version)"
          echo "the serving image reports: '${ver}'"
          case "${ver}" in
            *"${VERSION_TAG#v} (commit ${SHORT_SHA})"*) echo "serving verified: /readyz 200, schema ${schema}, version ${VERSION_TAG}" ;;
            *) echo "::error::the serving image reports '${ver}', not ${VERSION_TAG#v} (commit ${SHORT_SHA})"; exit 1 ;;
          esac

      - name: Remove the serving verification's containers
        if: always()
        run: |
          docker rm -f idp-verify idp-verify-pg >/dev/null 2>&1 || true
          docker network rm idp-verify >/dev/null 2>&1 || true

      - name: Vulnerability scan (Trivy) — fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to GHCR
        # Login happens ONLY after verification + scan pass, so a failed check
        # never reaches an authenticated push.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch, provenance + SBOM)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deployment/Dockerfile.local
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version_semver }}
            COMMIT=${{ steps.meta.outputs.short_sha }}
          # Apple Silicon hosts pull linux/arm64 natively; linux/amd64 covers
          # the GitHub-hosted runner and most server deployments.
          platforms: linux/amd64,linux/arm64
          # SLSA provenance + SBOM attestations on the published manifest.
          provenance: true
          sbom: true
