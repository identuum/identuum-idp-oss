# conformance/compose.tls.yml — THE-CONFORMANCE-HARNESS.
#
# Self-signed https for the OP, INSIDE the isolated compose network only.
# MEASURED (DO-3, first run at http): the suite RUNS against an http OP but
# its certification conditions fail every endpoint on scheme alone —
# CheckDiscEndpointDiscoveryUrl, CheckDiscEndpointIssuerIsValidUrl,
# CheckDiscEndpoint{Authorization,Token,Userinfo}Endpoint, CheckJwksUri,
# CheckDiscEndpointAllEndpointsAreHttps — which would drown every real
# finding in transport noise. So the standing harness fronts the OP with
# this nginx (debian-based, IMG-NONALPINE) terminating a per-run self-signed
# cert generated by run.sh into the throwaway work dir. Nothing here is
# reachable from outside the compose network.
#
# No host directory is mounted (OSS-CANDIDATE-LIFECYCLE-FIX, SPEC K1/K8):
# run.sh creates this container without starting it, copies default.conf,
# op.crt and op.key into /etc/nginx/conf.d with `docker cp` by the
# container's recorded ID, and only then starts it.
services:
  conformance-op:
    image: nginx:1.27-bookworm
    depends_on:
      - conformance-idp
